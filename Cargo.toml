[package]
name = "deezer-tui"
version = "0.2.7"
edition = "2024"
rust-version = "1.88"

[features]
default = []
pipewire = ["cpal/pipewire"]

[dependencies]
# TUI и графика
ratatui = { version = "0.30.2", features = ["layout-cache", "macros"] }
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }

# Аудио и DSP
symphonia = { version = "0.6.1", features = ["flac", "mp3", "aac", "isomp4"] }
cpal = "0.18.2"
rtrb = "0.4.1"
realfft = "3.5.0"
num-complex = "0.4"

# Сеть, асинхронность и криптография Deezer
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "cookies", "query"] }
blowfish = "0.9"
cbc = { version = "0.1", features = ["std"] }
cipher = "0.4"
md-5 = "0.10"
hex = "0.4"
tempfile = "3.15"

# Сериализация, логирование и системная интеграция (MPRIS через чистый Rust zbus)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2.1"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
